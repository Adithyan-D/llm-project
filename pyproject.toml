[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]
exclude = [".venv", "frontend", "notebooks", "model_registry"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
